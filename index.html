<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RotateFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-labelledby="title">
    <header class="header">
      <div class="brand"><img src="Logo.png" alt="" class="logo"><div><h1 id="title">RotateFlow</h1><p>Transform media without changing the source</p></div></div>
      <button id="themeButton" class="icon-button" type="button" title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">◐</button>
    </header>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="error" class="error" role="alert" hidden></div>

    <section class="section target-section" aria-labelledby="target-label">
      <div class="section-title"><label id="target-label" for="targetSelect">Media target</label><span id="targetCount"></span></div>
      <select id="targetSelect" disabled><option value="">Scanning page…</option></select>
      <p id="targetMeta" class="hint">Visible media is detected automatically.</p>
    </section>

    <section class="controls" aria-label="Media controls">
      <div class="control-row"><div class="control-heading"><label for="zoom">Zoom</label><output id="zoomValue" for="zoom">100%</output></div><div class="inline"><button id="zoomOut" type="button" disabled aria-label="Zoom out">−</button><input id="zoom" type="range" min="10" max="1000" step="1" value="100" disabled><button id="zoomIn" type="button" disabled aria-label="Zoom in">+</button></div><input id="zoomInput" class="number-input" type="number" min="10" max="1000" step="1" value="100" disabled aria-label="Zoom percentage"></div>
      <div class="control-row"><div class="control-heading"><label for="positionX">Pan X</label><output id="positionXValue" for="positionX">0 px</output></div><input id="positionX" type="range" min="-5000" max="5000" step="1" value="0" disabled><input id="positionXInput" class="number-input" type="number" min="-5000" max="5000" value="0" disabled aria-label="Horizontal position in pixels"></div>
      <div class="control-row"><div class="control-heading"><label for="positionY">Pan Y</label><output id="positionYValue" for="positionY">0 px</output></div><input id="positionY" type="range" min="-5000" max="5000" step="1" value="0" disabled><input id="positionYInput" class="number-input" type="number" min="-5000" max="5000" value="0" disabled aria-label="Vertical position in pixels"></div>
      <div class="button-row"><button id="centerButton" class="secondary" type="button" disabled>Center</button><button id="resetZoom" class="secondary" type="button" disabled>Reset zoom</button></div>
      <div class="control-row"><div class="control-heading"><label for="rotation">Rotation</label><output id="rotationValue" for="rotation">0°</output></div><input id="rotation" type="range" min="-3600" max="3600" step="1" value="0" disabled><input id="rotationInput" class="number-input" type="number" min="-3600" max="3600" value="0" disabled aria-label="Rotation in degrees"><div class="button-row compact"><button id="rotateLeft" type="button" disabled>−90°</button><button id="rotateRight" type="button" disabled>+90°</button><button id="rotate45" type="button" disabled>45°</button><button id="rotate180" type="button" disabled>180°</button></div></div>
      <div class="button-row"><button id="flipH" type="button" disabled>↔ Flip horizontal</button><button id="flipV" type="button" disabled>↕ Flip vertical</button></div>
      <details><summary>Filters</summary><div class="control-row"><div class="control-heading"><label for="brightness">Brightness</label><output id="brightnessValue" for="brightness">100%</output></div><input id="brightness" type="range" min="50" max="150" step="1" value="100" disabled></div><div class="control-row"><div class="control-heading"><label for="contrast">Contrast</label><output id="contrastValue" for="contrast">100%</output></div><input id="contrast" type="range" min="50" max="150" step="1" value="100" disabled></div></details>
    </section>

    <section class="settings" aria-label="Settings"><label class="toggle"><input id="keyboardToggle" type="checkbox" checked><span>Enable keyboard shortcuts</span></label><p id="keyboardStatus" class="hint">Shortcuts enabled: R rotate, H/V flip, +/- zoom, arrows pan.</p></section>
    <section class="actions"><button id="resetButton" class="secondary" type="button" disabled>Reset target</button><button id="resetAllButton" class="danger" type="button" disabled>Reset all</button></section>
    <footer id="qualityNote">Transformations affect display only; originals are never downloaded or re-encoded.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
